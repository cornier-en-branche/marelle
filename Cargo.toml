[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/cornier-en-branche/marelle"
rust-version = "1.85"

[workspace.dependencies]
marelle-config = { path = "crates/marelle-config" }
marelle-i18n = { path = "crates/marelle-i18n" }
marelle-providers = { path = "crates/marelle-providers" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
strip = true
