[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/cornier-en-branche/marelle"
rust-version = "1.85"

[workspace.dependencies]
marelle-config = { path = "crates/marelle-config" }
marelle-core = { path = "crates/marelle-core" }
marelle-i18n = { path = "crates/marelle-i18n" }
marelle-providers = { path = "crates/marelle-providers" }
marelle-testkit = { path = "crates/marelle-testkit" }

# HTTP stack. TLS is configured by hand in marelle-providers (rustls with the
# ring provider and bundled Mozilla roots), so reqwest gets no provider of its
# own. HTTP/2, compression and cookies are left out on purpose.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "time"] }
webpki-roots = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
strip = true
