name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

# Third-party actions are pinned to a commit. The comment names the release.
jobs:
  test:
    name: Format, lint and test (stable Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default stable
          rustc --version
      - run: cargo fmt --all -- --check
      - name: Resolve and validate dependency graph
        run: cargo check --workspace --all-targets
      - name: Show generated lockfile changes
        run: git diff -- Cargo.lock
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  msrv:
    name: Minimum supported Rust (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - name: Install Rust 1.85
        run: rustup toolchain install 1.85.0 --profile minimal --no-self-update
      - run: cargo +1.85.0 check --workspace --all-targets

  android:
    name: Android build for Termux (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-linux-android, armv7-linux-androideabi]
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - name: Add the Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Set up the NDK toolchain
        run: scripts/ci/android-env.sh ${{ matrix.target }}
      - name: Build
        run: cargo build --release -p marelle-cli --target ${{ matrix.target }}
      - name: Inspect the binary
        run: |
          bin="target/${{ matrix.target }}/release/marelle"
          ls -l "$bin"
          readelf="$ANDROID_TOOLCHAIN_BIN/llvm-readelf"
          "$readelf" -h "$bin" | grep -E 'Class|Machine|Type'
          "$readelf" -d "$bin" | grep NEEDED || true
          # Termux ships libc, libm and libdl. Anything else would have to be
          # installed by the user first.
          if "$readelf" -d "$bin" | grep -E 'NEEDED.*\[(libc\+\+_shared|libssl|libcrypto|libz)\.so'; then
            echo "::error::the binary needs a library that Termux does not provide by default"
            exit 1
          fi
